name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: escapehub
          POSTGRES_USER: escapehub
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escapehub -d escapehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run JavaScript tests
        run: node --test src/test/js/*.test.js

      - name: Build, test and run Checkstyle
        run: mvn -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/escapehub
          DB_USERNAME: escapehub
          DB_PASSWORD: ci-test-password