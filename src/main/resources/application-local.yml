spring:
  datasource:
    url: jdbc:h2:mem:escapehub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Bind the local development server to the LAN interface so other devices can connect.
server:
  address: 0.0.0.0
