spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/escapehub}
    username: ${DB_USERNAME:escapehub}
    password: ${DB_PASSWORD:change-this-local-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
