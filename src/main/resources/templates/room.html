<!DOCTYPE html>
<html lang="el" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${roomName} + ' - EscapeHub'">EscapeHub - Δωμάτιο</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container">
    <header>
        <p><a th:href="@{/}">← Επιστροφή στην Αρχική</a></p>
        <h1 id="room-title" th:text="${roomName}">Όνομα Δωματίου</h1>
    </header>

    <section aria-labelledby="room-title">
        <p id="room-description" th:text="${roomDescription}">
            Περιγραφή δωματίου...
        </p>
        <p>
            <a th:href="@{/multiplayer-room}">Άνοιγμα της νέας προβολής multiplayer room →</a>
        </p>
    </section>

    <section aria-labelledby="room-objects-heading">
        <h2 id="room-objects-heading">Αντικείμενα στον χώρο</h2>
        <div class="room-object-card" th:attr="data-object-id=${objectId}">
            <h3 th:text="${objectName}">Όνομα Αντικειμένου</h3>
            <p th:text="${objectSummary}">Σύντομη περιγραφή αντικειμένου.</p>
            <button type="button"
                    id="select-object-btn"
                    aria-controls="clue-panel"
                    aria-expanded="false"
                    th:attr="data-object-id=${objectId}">
                Επιλογή αντικειμένου
            </button>
            <div id="clue-panel" class="clue-panel" role="status" aria-live="polite" hidden>
                <h4>Ένδειξη</h4>
                <p id="clue-text" th:text="${objectClue}">Κείμενο ένδειξης.</p>
            </div>
        </div>
    </section>
</main>
<script th:src="@{/js/room.js}"></script>
</body>
</html>
